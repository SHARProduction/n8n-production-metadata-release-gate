<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>n8n Metadata Release Gate | SHAR Production</title><link rel="canonical" href="https://sharproduction.github.io/n8n-production-metadata-release-gate/"><style>body{font:16px system-ui;max-width:760px;margin:40px auto;padding:0 18px;color:#18202a}textarea,button{font:inherit;width:100%;box-sizing:border-box;margin:8px 0;padding:10px}button{background:#172a46;color:#fff;border:0;border-radius:6px;width:auto}pre{white-space:pre-wrap;background:#f3f5f8;padding:14px;border-radius:6px}</style></head><body><h1>n8n Metadata Release Gate</h1><p>SHAR Production is an AI-hybrid video production studio. Try the release-state logic used by the importable n8n workflow.</p><textarea id="data" rows="9">{"title":"Synthetic sample","project":"Demo","stage":"delivery","rights_status":"cleared"}</textarea><button id="run">Run release gate</button><pre id="output">Ready.</pre><p><a href="https://sharprod.com/">SHAR Production</a> · MIT</p><script>run.onclick=()=>{try{let x=JSON.parse(data.value),e=[];for(let k of['title','project','stage','rights_status'])if(!x[k])e.push(k+' required');if(x.rights_status==='unknown')e.push('unknown rights block release');output.textContent=JSON.stringify({releasable:!e.length,errors:e},null,2)}catch(e){output.textContent='Invalid JSON: '+e.message}}</script></body></html>
